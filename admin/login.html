<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Hassaan Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg: #060612; --bg2: #0d0d1f; --accent: #00d4ff;
      --accent2: #7c3aed; --text: #e2e8f0; --text2: #94a3b8;
      --border: rgba(255,255,255,0.08); --green: #10b981; --red: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .login-wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px; padding: 1rem;
    }
    .login-card {
      background: rgba(13,13,31,0.95);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0,212,255,0.05);
      animation: slideIn 0.6s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes slideIn { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }
    .login-header { text-align: center; margin-bottom: 2.5rem; }
    .login-logo {
      font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .login-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444; padding: 0.3rem 0.8rem;
      border-radius: 50px; font-size: 0.75rem; font-weight: 600;
    }
    .login-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.3rem; }
    .login-sub { color: var(--text2); font-size: 0.85rem; }
    .form-group { position: relative; margin-bottom: 1.25rem; }
    .form-group i {
      position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
      color: var(--text2); font-size: 0.9rem; pointer-events: none;
    }
    .form-group input {
      width: 100%; padding: 0.9rem 1rem 0.9rem 2.8rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px; color: var(--text);
      font-size: 0.95rem; outline: none;
      transition: all 0.3s ease;
    }
    .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
    .form-group .toggle-pw {
      position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
      cursor: pointer; color: var(--text2); background: none; border: none;
      font-size: 0.9rem; pointer-events: all;
    }
    .btn-login {
      width: 100%; padding: 0.9rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 12px;
      color: white; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,212,255,0.4); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .login-error {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444; padding: 0.75rem 1rem;
      border-radius: 10px; font-size: 0.85rem; text-align: center;
      margin-top: 1rem; display: none;
    }
    .back-link {
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      margin-top: 1.5rem; color: var(--text2); font-size: 0.85rem;
      text-decoration: none; transition: color 0.3s;
    }
    .back-link:hover { color: var(--accent); }
    .security-note {
      margin-top: 1.5rem; text-align: center;
      color: var(--text2); font-size: 0.75rem;
      display: flex; align-items: center; justify-content: center; gap: 0.3rem;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">&lt;H/&gt;</div>
        <div class="login-badge"><i class="fas fa-lock"></i> Admin Only</div>
        <h1 class="login-title" style="margin-top:1rem">Admin Panel</h1>
        <p class="login-sub">Sign in to manage your portfolio</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <i class="fas fa-user"></i>
          <input type="text" id="username" placeholder="Username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
          <button type="button" class="toggle-pw" onclick="togglePw()"><i class="fas fa-eye" id="eyeIcon"></i></button>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
        <div class="login-error" id="loginError"></div>
      </form>
      <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
      <div class="security-note"><i class="fas fa-shield-alt"></i> Secured with JWT Authentication</div>
    </div>
  </div>
  <script>
    // Particles
    const c = document.getElementById('c'), cx = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    window.addEventListener('resize', () => { c.width = window.innerWidth; c.height = window.innerHeight; });
    const pts = Array.from({length:60}, () => ({ x: Math.random()*c.width, y: Math.random()*c.height, vx:(Math.random()-.5)*.5, vy:(Math.random()-.5)*.5, r:Math.random()*2+.5 }));
    function drawPts() {
      cx.clearRect(0,0,c.width,c.height);
      pts.forEach(p => {
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0||p.x>c.width)p.vx*=-1;
        if(p.y<0||p.y>c.height)p.vy*=-1;
        cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2);
        cx.fillStyle='rgba(0,212,255,0.15)'; cx.fill();
      });
      requestAnimationFrame(drawPts);
    }
    drawPts();

    function togglePw() {
      const pw = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pw.type === 'password') { pw.type = 'text'; icon.className = 'fas fa-eye-slash'; }
      else { pw.type = 'password'; icon.className = 'fas fa-eye'; }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
      btn.disabled = true; err.style.display = 'none';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (data.token) { localStorage.setItem('adminToken', data.token); window.location.href = '/admin'; }
        else { err.textContent = data.error || 'Invalid credentials'; err.style.display = 'block'; }
      } catch { err.textContent = 'Connection error. Is the server running?'; err.style.display = 'block'; }
      finally { btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In'; btn.disabled = false; }
    });
  </script>
</body>
</html>
